ktor:
  deployment:
    port: 8080
  application:
    modules:
      - nl.rhaydus.plugins.SerializationKt.configureSerialization
      - nl.rhaydus.plugins.ResourcesKt.configureResources
      - nl.rhaydus.plugins.DatabaseKt.configureDatabases
      - nl.rhaydus.plugins.GraphQLClientKt.configureGraphQLClient
      - nl.rhaydus.plugins.AuthenticationKt.configureAuthentication
      - nl.rhaydus.plugins.RoutingKt.configureRouting

storage:
  jdbcUrl: "jdbc:h2:file:./data/settings;DB_CLOSE_DELAY=-1"
  driverClassName: "org.h2.Driver"
  # Secrets are read from the environment; defaults (after the colon) are dev-only.
  user: "$DB_USER:"
  password: "$DB_PASSWORD:"

hardcover:
  graphqlUrl: "https://api.hardcover.app/v1/graphql"